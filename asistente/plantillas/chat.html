<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de CFDI</title>
<style>
  /* Paleta formal: carbón y dorado, la misma del Excel (revision/reportes.py) */
  :root { --carbon:#1f1f1f; --dorado:#c9a13b; --dorado-oscuro:#8a6d1f; --fondo:#f4f1ea; --panel:#ffffff;
          --texto:#1f1f1f; --tenue:#6b6558; --borde:#ddd6c7; --franja:#f8f6f1; --yo:#1f1f1f; --yo-texto:#f4f1ea;
          --codigo:#faf8f3; --aviso:#7a5c12; --error:#8b1e2d; --vino:#7a1f2b;
          --serif: Georgia, "Times New Roman", serif; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#121212; --panel:#1b1b1b; --texto:#ece8df; --tenue:#a39e93; --borde:#33302a; --franja:#202020;
            --yo:#2a2722; --yo-texto:#ece8df; --codigo:#161616; --aviso:#e0b955; --error:#e0808c; --dorado-oscuro:#c9a13b; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--fondo); color:var(--texto);
         font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }

  /* encabezado: barra carbón con línea dorada, igual en claro y oscuro */
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; background:var(--carbon);
           border-bottom:3px solid var(--dorado); color:#f4f1ea; }
  header .marca { width:34px; height:34px; flex:none; display:grid; place-items:center; border:1px solid var(--dorado);
                  color:var(--dorado); font: 600 15px var(--serif); letter-spacing:.5px; }
  header .titulo { flex:1; min-width:0; }
  header .titulo b { display:block; font: 600 19px/1.2 var(--serif); letter-spacing:.3px; }
  header .titulo small { display:block; color:var(--dorado); font-size:10.5px; letter-spacing:1.6px;
                         text-transform:uppercase; margin-top:2px; }
  header .titulo span { display:block; color:#b9b3a6; font-size:12.5px; margin-top:3px; }
  header label { display:flex; align-items:center; gap:8px; color:#b9b3a6; font-size:11px; letter-spacing:1.2px;
                 text-transform:uppercase; }
  header select { max-width:280px; padding:7px 10px; border:1px solid #4a463d; border-radius:2px; background:#2a2a2a;
                  color:#f4f1ea; font:inherit; font-size:13.5px; letter-spacing:0; text-transform:none; }
  header select:focus { outline:1px solid var(--dorado); }
  header .boton { background:transparent; color:#f4f1ea; border-color:#4a463d; }
  header .boton:hover { border-color:var(--dorado); color:var(--dorado); }

  /* zona para soltar XML: cubre la página mientras se arrastran archivos */
  #soltar { position:fixed; inset:0; z-index:10; display:none; place-items:center; background:rgba(201,161,59,.14);
            border:2px dashed var(--dorado); font: 600 22px var(--serif); color:var(--dorado-oscuro); pointer-events:none; }
  body.arrastrando #soltar { display:grid; }
  .aviso { background:#efe8d6; color:var(--aviso); padding:8px 24px; font-size:13.5px; border-bottom:1px solid var(--borde); }
  @media (prefers-color-scheme: dark) { .aviso { background:#241f14; } }
  .aviso:empty { display:none; }

  .boton { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border:1px solid var(--borde);
           border-radius:2px; background:var(--panel); color:var(--texto); font:inherit; font-size:13.5px;
           cursor:pointer; text-decoration:none; white-space:nowrap; }
  .boton:hover { border-color:var(--dorado); }
  .boton.principal { background:var(--carbon); border-color:var(--carbon); color:#f4f1ea; font-weight:600; letter-spacing:.3px; }
  .boton.principal:hover { background:#000; border-color:var(--dorado); color:var(--dorado); }
  @media (prefers-color-scheme: dark) { .boton.principal { background:var(--dorado); border-color:var(--dorado); color:#1a1a1a; }
                                        .boton.principal:hover { background:#d9b350; color:#1a1a1a; } }
  button:disabled { opacity:.5; cursor:default; }

  /* conversación */
  #conversacion { flex:1; overflow-y:auto; padding:24px 16px; }
  #chat { display:flex; flex-direction:column; gap:14px; max-width:900px; margin:0 auto; }
  .msg { max-width:88%; padding:12px 16px; border-radius:2px; overflow-wrap:anywhere; background:var(--panel);
         border:1px solid var(--borde); border-left:3px solid var(--dorado); align-self:flex-start;
         box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .msg .texto { white-space:pre-wrap; }
  .msg.yo { background:var(--yo); color:var(--yo-texto); border-color:var(--yo); align-self:flex-end; white-space:pre-wrap; }
  .msg.ancho { width:100%; max-width:100%; }
  .msg.espera { color:var(--tenue); font-style:italic; }
  .msg.espera::after { content:''; animation: puntos 1.2s steps(4) infinite; }
  @keyframes puntos { 0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75% { content:'...'; } }

  /* SQL y filas de cada consulta: la tabla con el mismo encabezado del Excel */
  details.consulta { margin-top:12px; border:1px solid var(--borde); border-radius:2px; background:var(--panel); }
  details.consulta summary { cursor:pointer; padding:7px 12px; font-size:11.5px; color:var(--tenue);
                             letter-spacing:1px; text-transform:uppercase; }
  details.consulta.fallo summary { color:var(--error); }
  details.consulta pre { margin:0; padding:10px 12px; background:var(--codigo); border-top:1px solid var(--borde);
                         font:12.5px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; }
  .tabla { overflow-x:auto; border-top:1px solid var(--borde); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:6px 10px; border-bottom:1px solid var(--borde); text-align:left; white-space:nowrap; }
  th { background:var(--carbon); color:#f4f1ea; font-weight:600; border-bottom:2px solid var(--dorado); }
  tbody tr:nth-child(even) td { background:var(--franja); }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  .nota-tabla { padding:5px 12px; font-size:12px; color:var(--tenue); }

  /* archivos adjuntos */
  .archivos { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .archivo { border:1px solid var(--borde); border-radius:2px; background:var(--panel); overflow:hidden; }
  .archivo .fila { display:flex; align-items:center; gap:12px; padding:9px 12px; flex-wrap:wrap; }
  .archivo .ext { flex:none; width:42px; height:42px; display:grid; place-items:center; font-size:10.5px;
                  font-weight:700; letter-spacing:.5px; color:var(--dorado); background:var(--carbon); }
  .archivo .ext.pdf { color:#f4f1ea; background:var(--vino); }
  .archivo .info { flex:1; min-width:140px; }
  .archivo .info b { display:block; font-size:14px; }
  .archivo .info span { color:var(--tenue); font-size:12.5px; }
  .archivo .acciones { display:flex; gap:6px; }
  .archivo iframe { display:block; width:100%; height:70vh; border:0; border-top:1px solid var(--borde); background:#fff; }

  /* pantalla inicial */
  .bienvenida { text-align:center; padding:4vh 0 8px; }
  .bienvenida h1 { font: 600 26px/1.25 var(--serif); margin:0 0 8px; letter-spacing:.2px; }
  .bienvenida .filete { width:56px; height:2px; background:var(--dorado); margin:0 auto 12px; }
  .bienvenida p { color:var(--tenue); margin:0 auto 26px; max-width:620px; }
  .grupos { display:grid; gap:14px; grid-template-columns:repeat(2, 1fr); text-align:left; }
  .grupos.tres { grid-template-columns:repeat(3, 1fr); margin-top:14px; }
  @media (max-width: 760px) { .grupos, .grupos.tres { grid-template-columns:1fr; } }
  .grupo { background:var(--panel); border:1px solid var(--borde); border-top:3px solid var(--borde); border-radius:2px;
           padding:14px 12px 10px; }
  .grupo.destacado { border-top-color:var(--dorado); }
  .grupo h2 { font-size:11px; color:var(--dorado-oscuro); margin:0 0 8px 8px; font-weight:700; letter-spacing:1.3px;
              text-transform:uppercase; }
  .grupo button { display:block; width:100%; text-align:left; background:none; border:0; border-radius:2px;
                  padding:6px 8px; color:var(--texto); font:inherit; font-size:14px; cursor:pointer; }
  .grupo button:hover { background:var(--franja); color:var(--dorado-oscuro); }

  /* barra con lo del reto: siempre visible, no usa IA */
  .reto { display:flex; flex-wrap:wrap; align-items:center; gap:6px; max-width:900px; margin:0 auto 10px; }
  .reto > span { color:var(--dorado-oscuro); font-size:10.5px; font-weight:700; letter-spacing:1.3px;
                 text-transform:uppercase; margin-right:2px; }
  .reto .boton { padding:4px 11px; font-size:12.5px; }

  #pregunta { padding:12px 16px 14px; background:var(--panel); border-top:1px solid var(--borde); }
  #pregunta .caja { display:flex; gap:8px; align-items:flex-end; max-width:900px; margin:0 auto; }
  #texto { flex:1; min-width:0; resize:none; max-height:160px; padding:10px 12px; border:1px solid var(--borde);
           border-radius:2px; background:var(--fondo); color:var(--texto); font:inherit; }
  #texto:focus { outline:1px solid var(--dorado); border-color:var(--dorado); }
  #pregunta p { max-width:900px; margin:7px auto 0; color:var(--tenue); font-size:11.5px; text-align:center; }
  @media (max-width: 640px) { .msg, .msg.ancho { max-width:100%; width:100%; } header .boton span { display:none; }
                              header { flex-wrap:wrap; padding:10px 16px; } header label { width:100%; }
                              header select { max-width:none; flex:1; } }
</style>
<header>
  <div class="marca" aria-hidden="true">CF</div>
  <div class="titulo"><b>Revisión de CFDI</b><small>Automatización de facturas electrónicas</small><span id="cifras">{{ cifras }}</span></div>
  <label>Cliente <select id="cliente" title="Limita los reportes y las preguntas a un cliente"><option value="">Todos</option></select></label>
  <button class="boton" id="nueva" title="Nueva conversación">＋ <span>Nueva conversación</span></button>
</header>
<div class="aviso">{{ aviso }}</div>
<div id="soltar">Suelte aquí los archivos XML para cargarlos</div>
<input type="file" id="archivos" accept=".xml" multiple hidden data-max-mb="{{ max_mb }}">
<div id="conversacion"><div id="chat"></div></div>
<form id="pregunta">
  <div class="reto" id="reto"></div>
  <div class="caja">
    <textarea id="texto" rows="1" placeholder="Escriba su consulta sobre facturas, proveedores o incidencias" autocomplete="off"></textarea>
    <button class="boton principal" id="enviar">Enviar</button>
  </div>
  <p>Consultas con IA ({{ modelo }}) · Enter para enviar, Shift+Enter para nueva línea · El SQL se ejecuta en modo de solo lectura</p>
</form>
<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), zona = $('#conversacion'), texto = $('#texto'), enviar = $('#enviar');
const GUARDADO = 'conversacion-cfdi';
// lo que pide el reto: respuestas fijas del servidor, sin IA
const RETO = [['cargar', 'Cargar XML'], ['detalle', 'Detalle'], ['resumen', 'Resumen por proveedor'],
              ['incidencias', 'Incidencias'], ['excel', 'Excel']];
// lo extra que tampoco usa IA
const EXTRA = [['subir', 'Subir XML…'], ['clientes', 'Resumen por cliente']];
const ETIQUETA_RETO = 'Reportes del reto', ETIQUETA_EXTRA = 'Adicional';
const MAX_MB = Number(document.getElementById('archivos').dataset.maxMb);
// lo extra: ejemplos de preguntas libres para la IA
const EJEMPLOS = {
  'Consultas · IA': ['¿Qué proveedor cobró más IVA?', '¿Cuál fue la factura de mayor monto?', '¿Qué servicios prestó la constructora?'],
  'Incidencias · IA': ['¿Qué facturas venían duplicadas?', '¿Por qué hay facturas sin IVA?', '¿Qué archivo venía dañado?'],
  'Documentos · IA': ['PDF de la factura de mayor monto', 'PDF de las facturas de Mario García', 'PDF de la última factura de septiembre'],
};

// crea un elemento; el texto siempre entra como texto, nunca como HTML
function h(tag, props, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const x of hijos.flat()) if (x !== null && x !== undefined && x !== false) e.append(x.nodeType ? x : String(x));
  return e;
}

// la conversación se guarda en este navegador para que sobreviva a una recarga
let mensajes = [];
try { mensajes = JSON.parse(localStorage.getItem(GUARDADO)) || []; } catch (e) { mensajes = []; }
function guardar() { try { localStorage.setItem(GUARDADO, JSON.stringify(mensajes.slice(-40))); } catch (e) {} }

function abajo() { zona.scrollTop = zona.scrollHeight; }

// **negritas** sin interpretar nada más como HTML
function formato(t) {
  const d = h('div', { class: 'texto' });
  t.split(/(\*\*[^*\n]+\*\*)/).forEach(parte => {
    if (/^\*\*[^*\n]+\*\*$/.test(parte)) d.append(h('b', null, parte.slice(2, -2)));
    else d.append(parte);
  });
  return d;
}

const dinero = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// una columna con algún decimal es de importes: todos sus valores llevan 2 decimales (0 -> 0.00)
function celda(v, importe) {
  if (typeof v === 'number') return h('td', { class: 'num' }, importe ? dinero.format(v) : String(v));
  return h('td', null, v === null ? '' : v);
}

function consulta(c, abierta) {
  if (c.error) return h('details', { class: 'consulta fallo' },
    h('summary', null, 'Consulta rechazada o con error · se devolvió al modelo para corregirla'),
    h('pre', null, (c.sql || '') + '\n\n-- ' + c.error));
  const filas = c.total === 1 ? '1 fila' : `${c.mas ? 'más de ' + (c.total - 1) : c.total} filas`;
  const numerica = c.columnas.map((_, i) => c.filas.length > 0 && typeof c.filas[0][i] === 'number');
  const importe = c.columnas.map((_, i) => c.filas.some(f => typeof f[i] === 'number' && !Number.isInteger(f[i])));
  return h('details', { class: 'consulta', open: abierta },
    h('summary', null, `${c.titulo || 'SQL ejecutado'} · ${filas}`),
    c.sql ? h('pre', null, c.sql) : null,
    c.filas.length ? h('div', { class: 'tabla' }, h('table', null,
      h('thead', null, h('tr', null, c.columnas.map((x, i) => h('th', { class: numerica[i] ? 'num' : null }, x)))),
      h('tbody', null, c.filas.map(f => h('tr', null, f.map((v, i) => celda(v, importe[i]))))))) : null,
    c.total > c.filas.length ? h('div', { class: 'nota-tabla' }, `Se muestran ${c.filas.length} filas.`) : null);
}

function archivo(a, abierto) {
  const ext = (a.nombre.split('.').pop() || '').toLowerCase();
  const tarjeta = h('div', { class: 'archivo' });
  let vista = null;
  const ver = h('button', { class: 'boton', type: 'button', onclick: () => alternar() }, 'Ver');
  function alternar(abrir) {
    abrir = abrir ?? !vista;
    if (abrir && !vista) { vista = h('iframe', { src: a.url, title: a.nombre }); tarjeta.append(vista); ver.textContent = 'Ocultar'; }
    else if (!abrir && vista) { vista.remove(); vista = null; ver.textContent = 'Ver'; }
  }
  tarjeta.append(h('div', { class: 'fila' },
    h('div', { class: 'ext ' + ext }, ext.toUpperCase()),
    h('div', { class: 'info' }, h('b', null, a.nombre), a.nota ? h('span', null, a.nota) : null),
    h('div', { class: 'acciones' },
      ext === 'pdf' ? ver : null,
      h('a', { class: 'boton' + (ext === 'pdf' ? '' : ' principal'), href: a.url, download: a.nombre }, 'Descargar'))));
  if (abierto) alternar(true);
  return tarjeta;
}

function pintar(m, nuevo) {
  if (m.rol === 'yo') { const d = h('div', { class: 'msg yo' }, m.texto); chat.append(d); return d; }
  const d = h('div', { class: 'msg' }, formato(m.texto));
  const consultas = m.consultas || [], adjuntos = m.adjuntos || [];
  if (consultas.length || adjuntos.length) d.classList.add('ancho');
  // la última consulta que funcionó se muestra abierta: es la que sostiene la respuesta
  const ultima = consultas.map(c => !c.error).lastIndexOf(true);
  consultas.forEach((c, i) => d.append(consulta(c, i === ultima)));
  if (adjuntos.length) {
    const pdfs = adjuntos.filter(a => a.nombre.toLowerCase().endsWith('.pdf'));
    d.append(h('div', { class: 'archivos' }, adjuntos.map(a => archivo(a, nuevo && pdfs.length === 1 && pdfs[0] === a))));
  }
  chat.append(d);
  return d;
}

function bienvenida() {
  chat.replaceChildren(h('div', { class: 'bienvenida' },
    h('h1', null, 'Revisión de facturas electrónicas'),
    h('div', { class: 'filete' }),
    h('p', null, 'Genere los reportes de la revisión con los botones, o formule una consulta en lenguaje natural: ' +
                 'el asistente redacta el SQL, lo ejecuta en modo de solo lectura y muestra los datos que respaldan cada respuesta.'),
    h('div', { class: 'grupos' },
      h('div', { class: 'grupo destacado' }, h('h2', null, ETIQUETA_RETO + ' · sin IA'),
        RETO.map(([accion, etiqueta]) => h('button', { type: 'button', onclick: () => reto(accion, etiqueta) }, etiqueta))),
      h('div', { class: 'grupo' }, h('h2', null, ETIQUETA_EXTRA + ' · sin IA'),
        EXTRA.map(([accion, etiqueta]) => h('button', { type: 'button', onclick: () => reto(accion, etiqueta) }, etiqueta)),
        h('p', { style: 'margin:6px 8px 0; font-size:12.5px; color:var(--tenue)' },
          'También puede arrastrar archivos XML a cualquier parte de la página.'))),
    // las consultas con IA, en su propia fila
    h('div', { class: 'grupos tres' },
      Object.entries(EJEMPLOS).map(([titulo, lista]) => h('div', { class: 'grupo' },
        h('h2', null, titulo), lista.map(t => h('button', { type: 'button', onclick: () => preguntar(t) }, t)))))));
}

function inicio() {
  if (!mensajes.length) return bienvenida();
  chat.replaceChildren();
  mensajes.forEach(m => pintar(m, false));
  abajo();
}

// --- cliente elegido: se manda en cada petición y se recuerda en este navegador
const selector = $('#cliente');
let guardado = '';
try { guardado = localStorage.getItem('cliente-cfdi') || ''; } catch (e) {}
// mientras no llega la lista de clientes, vale el que se eligió la última vez
function cliente() { return selector.options.length > 1 ? selector.value : guardado; }

function clientes(lista) {
  const elegido = cliente();
  selector.replaceChildren(h('option', { value: '' }, 'Todos'),
    ...lista.map(c => h('option', { value: c.rfc }, `${c.nombre || c.rfc} · ${c.rfc} (${c.facturas})`)));
  // si el cliente guardado ya no existe en la base, se regresa a Todos
  selector.value = lista.some(c => c.rfc === elegido) ? elegido : '';
}

function actualizar(datos) {
  if (datos.cifras) $('#cifras').textContent = datos.cifras;
  if (datos.clientes) clientes(datos.clientes);
}

async function estado() {
  try {
    const res = await fetch('/estado?cliente=' + encodeURIComponent(cliente()));
    if (res.ok) actualizar(await res.json());
  } catch (e) {}
}

selector.addEventListener('change', () => {
  guardado = selector.value;
  try { localStorage.setItem('cliente-cfdi', guardado); } catch (e) {}
  estado();
});

function preguntar(pregunta) { return mandar(pregunta, '/preguntar', { pregunta, cliente: cliente() }); }
function reto(accion, etiqueta) {
  if (accion === 'subir') return $('#archivos').click();
  return mandar(etiqueta, '/reto/' + accion, { cliente: cliente() });
}

// --- subir XML: con el botón o arrastrándolos a la página
function subir(lista) {
  const xml = [...lista].filter(f => f.name.toLowerCase().endsWith('.xml'));
  if (!xml.length) return;
  const mb = xml.reduce((s, f) => s + f.size, 0) / 1048576;
  if (mb > MAX_MB) { pintar({ rol: 'ia', texto: `Son ${mb.toFixed(1)} MB; el máximo por subida es ${MAX_MB} MB.` }); abajo(); return; }
  const datos = new FormData();
  xml.forEach(f => datos.append('xml', f));
  datos.append('cliente', cliente());
  const nombres = xml.length === 1 ? xml[0].name : `${xml.length} archivos XML`;
  return mandar('Subir ' + nombres, '/subir', datos);
}
$('#archivos').addEventListener('change', e => { subir(e.target.files); e.target.value = ''; });
let arrastres = 0;  // dragenter/dragleave se disparan por cada elemento hijo; se cuentan para saber cuándo sale de la página
const conArchivos = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragenter', e => { if (conArchivos(e)) { arrastres++; document.body.classList.add('arrastrando'); } });
document.addEventListener('dragleave', e => { if (conArchivos(e) && --arrastres <= 0) { arrastres = 0; document.body.classList.remove('arrastrando'); } });
document.addEventListener('dragover', e => { if (conArchivos(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!conArchivos(e)) return;
  e.preventDefault(); arrastres = 0; document.body.classList.remove('arrastrando');
  subir(e.dataTransfer.files);
});

async function mandar(etiqueta, url, cuerpo) {
  if (enviar.disabled) return;
  if (!mensajes.length) chat.replaceChildren();
  const mio = { rol: 'yo', texto: etiqueta };
  mensajes.push(mio); guardar(); pintar(mio);
  const espera = h('div', { class: 'msg espera' }, 'Procesando');
  chat.append(espera); abajo();
  enviar.disabled = true;
  let r;
  try {
    const archivos = cuerpo instanceof FormData;
    const res = await fetch(url, { method: 'POST', body: archivos ? cuerpo : JSON.stringify(cuerpo),
                                   headers: archivos ? { 'X-Bot': '1' } : { 'Content-Type': 'application/json' } });
    if (!res.ok && res.status !== 413) throw new Error(res.status);
    const datos = await res.json();
    r = { rol: 'ia', texto: datos.texto, consultas: datos.consultas, adjuntos: datos.adjuntos };
    actualizar(datos);
    mensajes.push(r); guardar();
  } catch (e) {
    r = { rol: 'ia', texto: 'No fue posible conectar con el servidor. Verifique que bot.py siga en ejecución.' };
  }
  espera.remove();
  const d = pintar(r, true);
  enviar.disabled = false;
  d.scrollIntoView({ block: 'start', behavior: 'smooth' });
  texto.focus();
}

function ajustar() { texto.style.height = 'auto'; texto.style.height = texto.scrollHeight + 'px'; }
texto.addEventListener('input', ajustar);
texto.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#pregunta').requestSubmit(); }
});
$('#pregunta').addEventListener('submit', e => {
  e.preventDefault();
  const p = texto.value.trim();
  if (!p || enviar.disabled) return;
  texto.value = ''; ajustar();
  preguntar(p);
});
$('#nueva').addEventListener('click', async () => {
  if (enviar.disabled) return;
  try { await fetch('/reiniciar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch (e) {}
  mensajes = []; guardar(); bienvenida(); texto.focus();
});

$('#reto').append(h('span', null, ETIQUETA_RETO));
RETO.forEach(([accion, etiqueta]) =>
  $('#reto').append(h('button', { class: 'boton', type: 'button', onclick: () => reto(accion, etiqueta) }, etiqueta)));
$('#reto').append(h('span', { style: 'margin-left:10px' }, ETIQUETA_EXTRA));
EXTRA.forEach(([accion, etiqueta]) =>
  $('#reto').append(h('button', { class: 'boton', type: 'button', onclick: () => reto(accion, etiqueta) }, etiqueta)));
estado();
inicio();
texto.focus();
</script>
</html>
